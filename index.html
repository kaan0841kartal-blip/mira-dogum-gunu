<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyi ki Doğdun Mira! 💙</title>
    <style>
        body {
            background: linear-gradient(135deg, #0b0f19, #111827);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 30px 15px;
            overflow-x: hidden;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: rgba(17, 24, 39, 0.7);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(59, 130, 246, 0.2);
        }
        h1 {
            color: #38bdf8;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
        p {
            font-size: 1.1em;
            line-height: 1.6;
            color: #93c5fd;
        }
        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1em;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(2, 132, 199, 0.5);
        }
        .btn:hover {
            background-color: #0369a1;
            transform: scale(1.05);
        }
        .form-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: left;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 1em;
            box-sizing: border-box;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }
        .messages-container {
            margin-top: 30px;
            text-align: left;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .message-card {
            background: rgba(30, 41, 59, 0.6);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 4px solid #38bdf8;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .message-card h4 {
            margin: 0 0 5px 0;
            color: #7dd3fc;
        }
        .message-card p {
            margin: 0;
            color: #e2e8f0;
            font-size: 0.95em;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>İyi ki Doğdun Mira! 💙</h1>
        <p>Burası senin için hazırladığımız özel doğum günü alanı! İsteyen herkes aşağıdan anılarını ve kutlama mesajlarını bırakabilir. 🚀</p>
        <button class="btn" onclick="kutla()">Sürprizi Patlat 🎉</button>

        <!-- Mesaj Gönderme Formu -->
        <div class="form-section">
            <h3 style="color: #38bdf8; margin-top: 0;">Anı veya Kutlama Bırak ✍️</h3>
            <input type="text" id="isimInput" placeholder="Adın Soyadın">
            <textarea id="mesajInput" rows="3" placeholder="Mira'ya güzel bir mesaj yaz..."></textarea>
            <button class="btn" style="width: 100%; margin-top: 5px;" onclick="mesajGonder()">Mesajı Gönder 🚀</button>
        </div>

        <!-- Canlı Mesajlar Duvarı -->
        <div class="messages-container" id="mesajlarListesi">
            <p style="text-align: center; color: #64748b;">Mesajlar yükleniyor...</p>
        </div>
    </div>

    <!-- Konfeti Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <!-- Firebase SDK (CDN Versiyonu) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCSFQpUfKXbA4hAOhXo4URjkdzEuwr46Ys",
            authDomain: "mira-dogum-gunu.firebaseapp.com",
            projectId: "mira-dogum-gunu",
            storageBucket: "mira-dogum-gunu.firebasestorage.app",
            messagingSenderId: "184730786971",
            appId: "1:184730786971:web:1a912a6bc45d8c70737a3e",
            measurementId: "G-FJDTHMEB28"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Global fonksiyonlar için window'a ekliyoruz
        window.kutla = function() {
            confetti({
                particleCount: 150,
                spread: 90,
                origin: { y: 0.6 }
            });
        };

        window.mesajGonder = async function() {
            const isim = document.getElementById('isimInput').value.trim();
            const mesaj = document.getElementById('mesajInput').value.trim();

            if (!isim || !mesaj) {
                alert("Lütfen adını ve mesajını yaz!");
                return;
            }

            try {
                await addDoc(collection(db, "mesajlar"), {
                    isim: isim,
                    mesaj: mesaj,
                    tarih: new Date()
                });
                document.getElementById('isimInput').value = '';
                document.getElementById('mesajInput').value = '';
                mesajlariGetir();
            } catch (e) {
                console.error("Hata oluştu: ", e);
                alert("Mesaj gönderilirken bir hata oluştu.");
            }
        };

        async function mesajlariGetir() {
            const listeDiv = document.getElementById('mesajlarListesi');
            listeDiv.innerHTML = '<p style="text-align: center; color: #64748b;">Mesajlar yükleniyor...</p>';

            try {
                const q = query(collection(db, "mesajlar"));
                const querySnapshot = await getDocs(q);
                
                listeDiv.innerHTML = '';
                if (querySnapshot.empty) {
                    listeDiv.innerHTML = '<p style="text-align: center; color: #64748b;">Henüz mesaj yazılmamış. İlk mesajı sen yaz! 💙</p>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const card = document.createElement('div');
                    card.className = 'message-card';
                    card.innerHTML = `<h4>${escapeHtml(data.isim)}</h4><p>${escapeHtml(data.mesaj)}</p>`;
                    listeDiv.appendChild(card);
                });
            } catch (e) {
                console.error("Mesajlar çekilemedi: ", e);
                listeDiv.innerHTML = '<p style="text-align: center; color: #f87171;">Mesajlar yüklenirken hata oluştu.</p>';
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Sayfa açılınca mesajları getir
        mesajlariGetir();
    </script>
</body>
</html>
